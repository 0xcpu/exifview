<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#357abd"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Camera icon -->
  <g fill="white">
    <!-- Camera body -->
    <rect x="24" y="44" width="80" height="56" rx="8"/>
    <!-- Lens -->
    <circle cx="64" cy="72" r="20" fill="#357abd"/>
    <circle cx="64" cy="72" r="14" fill="white"/>
    <circle cx="64" cy="72" r="8" fill="#357abd"/>
    <!-- Flash -->
    <rect x="82" y="52" width="14" height="8" rx="2"/>
    <!-- Viewfinder -->
    <rect x="48" y="32" width="32" height="16" rx="4"/>
  </g>
  <!-- Info badge -->
  <circle cx="100" cy="28" r="18" fill="#ff6b6b"/>
  <text x="100" y="34" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20" font-weight="bold">i</text>
</svg>
